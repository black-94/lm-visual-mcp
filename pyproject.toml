[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lm-visual-mcp"
version = "0.1.0"
description = "Vision MCP Server: give text-only LLMs / coding agents visual capabilities via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lm-visual-mcp contributors" }]
keywords = ["mcp", "vision", "vlm", "llm", "ai", "zai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp >= 1.2, < 2.0",
    "pydantic >= 2.7",
    "PyYAML >= 6.0",
    "google-genai >= 1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
    "Pillow >= 10.0",
]

[project.scripts]
lm-visual-mcp = "lm_visual_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_visual_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]