version: 1

providers:
  order:
    - agy
    - codex
    - gemini
    - opencode

  agy:
    enabled: true
    command: agy
    model: gemini-3.6-flash
    effort: high

  codex:
    enabled: true
    command: codex
    model: gpt-5.6-luna
    effort: high

  gemini:
    enabled: true
    model: gemini-3.6-flash
    effort: high
    api_key_env: GEMINI_API_KEY
    # For compatibility only — prefer api_key_env / environment variable.
    # api_key: "never-commit-a-plain-text-key"

  opencode:
    enabled: true
    command: opencode
    model: null
    effort: null

runtime:
  workdir: null
  timeout: 120
  # Requests beyond this queue inside the shared daemon. Set to 1 for strict
  # serial execution.
  max_concurrency: 2
  # Singleton transport: one shared daemon binds this host/port; every Claude
  # Code session proxies to it.
  host: 127.0.0.1
  port: 6506
  # Daemon exits after this long with no traffic (avoids orphan processes).
  idle_timeout_ms: 300000

fallback:
  enabled: true
  on:
    - command_not_found
    - not_authenticated
    - permission_denied
    - api_key_missing
    - quota_exhausted
    - unsupported_media
    - timeout
    - temporary_failure

media:
  max_image_mb: 20
  max_video_mb: 8
  download_timeout: 30
  max_download_mb: 32

logging:
  level: INFO

# Transparent vision proxy (lm-visual-mcp proxy). No image -> byte-level
# passthrough; image present -> describe via the providers above and rewrite.
proxy:
  host: 127.0.0.1
  port: 8787